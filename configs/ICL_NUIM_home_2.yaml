%YAML:1.0

CreateSingleObject: 0
MinimumMatchToAssociate: 10
Tracking.ShowEllipsoldProcess: 0
LocalMapping.ShowEllipsoldProcess: 0
LocalMapping.KeepRawPose: 0
Tracking.AddSuffixToPcd: 0
Tracking.AssociateObjectWithEllipsold: 1
Tracking.AssociateDebug: 0


LocalMapping.MinValidPoints: 50
LocalMapping.MinValidRays: 1

Tracking.AssociateIoUThresold: 0.52

Tracking.MinimumPtNumToJudgeGood: 5  # default 20

LocalMapping.DistFiltParam: 0.1

Tracking.IgnoreObject: 0
Tracking.AddDepthPcdToMapObject: 1
Tracking.UseDepthPcdToReconstruct: 1


QSPSLAM.VoxelSize: 0.001
QSPSLAM.NeedDatasetPointCloud: 0


# -------------------------
# 地平面提取参数： Ground Plane Extraction
# -------------------------
Plane.MinSize: 1000
Plane.AngleThreshold: 3.0
Plane.DistanceThreshold: 0.05
Plane.MannualCheck.Open: 1

# Mannual set
Plane.Groundplane.param: !!opencv-matrix
  rows: 1
  cols: 4
  dt: d
  data: [-0.00144757,   0.999998, -0.00141902, 1.2]

# when >0, filter using dis to groundplane
Visualization.Map.Filter.DisThresh: 2.3
Visualization.Map.Filter.DisThresh2: -0.1


# Visualization
Visualization.Builder.Open: 1
Visualization.Builder.Global.Open: 0


Vocabulary.Path: Vocabulary/ORBvoc.bin
Config.StandardParamFile: configs/Redwood_chair_01053.yaml


Dataset.Type: "ICL_NUIM"
Dataset.Path.Root: /media/lj/TOSHIBA/dataset/ICL-NUIM/home/living_room_traj2_frei_png
Dataset.Path.Save: map/icl_nuim/home/2
Dataset.Path.MapPcd: "./dataset.pcd"

Dataset.Path.AssociateFile: /associate.txt
MapObject.PointCloudVoxelSize: 0.03

Dataset.Path.ObjectAnno: /result/objects_qsp.txt

# Dataset.Path.ObjectGT: /objects_gt.txt
Dataset.Path.ObjectGT: /result/objects_qsp.txt

Dataset.Path.ObjectGroundGT:  /objects_gt.txt
Dataset.Path.TrajectoryGT:  /groundtruth.txt

# Result.ObjectEstimate: /result/objects.txt
Result.ObjectEstimate: /result/objects_qsp.txt
Result.TrajectoryEstimate: /result/traj.txt



#--------------------------------------------------------------------------------------------
# Parameters used for Object SLAM
#--------------------------------------------------------------------------------------------
# Config path for Python detectors
DetectorConfigPath: configs/config_ICL_NUIM_home.json
EllipObjects.maskErrosion: 5

# Tracking.UseGroundTruthTraj: 1

# Tracking.GroundTruthTrajFile: 

